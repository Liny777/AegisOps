[project]
name = "openops-backend-new"
version = "0.2.0"
description = "OpenOps V1 backend (17/22 号分层骨架 + PG + SSE)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "psycopg[binary,pool]>=3.2.0",
  "httpx>=0.27.0",  # oModel real adapter（OPENOPS_OMODEL=real）与外部 HTTP 客户端
  "cryptography>=42.0.0",  # Secret 应用层加密（Fernet + key 轮换，13 号 SEC-001）
  "python-multipart>=0.0.9",  # FastAPI Form/UploadFile（Skill ZIP 上传 /assets/skills:upload）
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]
# 真 AgentScope runtime（B1，OPENOPS_RUNTIME=agentscope 时需要）；pytest 默认走 mock 不装
agentscope = [
  "agentscope==2.0.3",
]
# 告警平台 Kafka 消费（7x24 接管，OPENOPS_ALERT=real 时需要）；默认 mock 不装
kafka = [
  "aiokafka>=0.11.0",
]
# 真 Docker 沙箱后端（B8，OPENOPS_SANDBOX=docker 时需要）；默认 fake 后端不装
sandbox = [
  "aiodocker>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
# ⚠ include 是**白名单**：新增顶层包必须登记，否则 `pip install .`（构 wheel）静默漏包。
# 本地跑 / pytest / run.py 全靠 sys.path 直挂 src，**都逮不到这个错**——唯一抓手是
# `pip wheel --no-deps` 后查包内容（已加进 scripts/release_check.sh）。
include = ["api*", "app*", "domain*", "infra*", "runtime*", "sandbox*", "studio*", "alerts*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
# tests 也上路径：tests/studio/*.py 要 `from conftest import ...`（模块级 import）。
# 不加的话「跑全量绿、单独跑 pytest tests/studio 报 ImportError」——最费时间的一类问题。
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"

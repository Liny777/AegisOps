[project]
name = "openops-backend-new"
version = "0.2.0"
description = "OpenOps V1 backend (17/22 号分层骨架 + PG + SSE)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "psycopg[binary,pool]>=3.2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]
# 真 AgentScope runtime（B1，OPENOPS_RUNTIME=agentscope 时需要）；pytest 默认走 mock 不装
agentscope = [
  "agentscope==2.0.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "app*", "domain*", "infra*", "runtime*", "sandbox*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

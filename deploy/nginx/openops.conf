# OpenOps 前端机 nginx 站点（宿主机 nginx；26/27 号拓扑：同域反代，前端全部相对路径 /api…）。
# 装载：sed "s/<BACKEND_HOST>/10.x.x.x/" openops.conf > /etc/nginx/conf.d/openops.conf
#      nginx -t && nginx -s reload
# 测试/生产同一份模板，仅 <BACKEND_HOST>（与 server_name，如有域名）不同。
server {
    listen 80;
    server_name _;

    # ---- TLS（拿到内网证书后启用：改 listen 443 ssl 并放开两行，80 段可 return 301）----
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/openops.pem;
    # ssl_certificate_key /etc/nginx/certs/openops.key;

    client_max_body_size 50m;   # Skill ZIP 上传

    # CopilotKit 流（本机 sidecar 容器）：流式响应，关缓冲 + 长超时
    location /api/copilotkit {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 探活便捷路由：后端真实 health 在根路径 /health（不带 /api）
    location = /api/health {
        proxy_pass http://<BACKEND_HOST>:18082/health;
    }

    # 后端 API（后端机 uvicorn:18082）。SSE/agui 长连接调优（34 号 §三·④ 前置项）；
    # X-Forwarded-For 首跳 = B9 IAM 的 IAM-Client-Ip 来源，必须透传。
    location /api {
        proxy_pass http://<BACKEND_HOST>:18082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端静态（SPA 回退到 index.html；react-router 路由都是前端路由）
    location / {
        root /opt/openops/frontend/dist;
        try_files $uri /index.html;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
        expires 1h;
    }
    location = /index.html {
        root /opt/openops/frontend/dist;
        add_header Cache-Control "no-cache";
    }
}

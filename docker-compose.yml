services:
  postgres:
    image: postgres:16-alpine
    container_name: openops-v1-pg
    environment:
      POSTGRES_USER: openops
      POSTGRES_PASSWORD: openops
      POSTGRES_DB: openops
    ports:
      - "5432:5432"
    volumes:
      # 首次启动自动建表（权威 DDL 由 Obsidian 19 号生成）
      - ./backend/sql/openops_v1_core.sql:/docker-entrypoint-initdb.d/01_core.sql:ro
      - openops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openops -d openops"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  openops_pgdata:

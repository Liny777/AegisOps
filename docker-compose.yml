services:
  postgres:
    image: postgres:16-alpine
    container_name: openops-v1-pg
    environment:
      POSTGRES_USER: openops
      POSTGRES_PASSWORD: openops
      POSTGRES_DB: openops
    ports:
      - "5432:5432"
    volumes:
      # 首次启动自动建表（权威 DDL 由 Obsidian 19 号生成）
      - ./backend/sql/openops_v1_core.sql:/docker-entrypoint-initdb.d/01_core.sql:ro
      # 垂直切片自带 DDL（initdb.d 不递归子目录，新增切片须在此显式加一行）
      - ./backend/sql/slices/studio_span.sql:/docker-entrypoint-initdb.d/02_studio.sql:ro
      - openops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openops -d openops"]
      interval: 3s
      timeout: 3s
      retries: 20
    # docker 默认 json-file 无上限，容器日志会一直涨到磁盘满（本机踩过 PG 因磁盘满起不来）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  openops_pgdata:
